<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>BuddyLab 移动伴侣</title><link rel="stylesheet" href="/companion.css"><script type="module" src="/companion.js"></script></head><body><header><strong>BuddyLab 移动伴侣</strong><button id="disconnect" hidden>断开</button></header><main><section id="pair-panel"><h1>连接自己的电脑</h1><p>设备请求需要在电脑端确认。此页面只连接该电脑的本地移动伴侣，不使用原版账号。</p><form id="pair-form"><label>设备名称<input name="name" maxlength="60" value="我的手机" required autocomplete="off"></label><button>请求配对</button></form></section><p id="status" role="status">等待配对。</p><section id="questions" aria-label="待回答问题" hidden></section><section id="messages" aria-label="助理对话" aria-live="polite"></section></main><form id="message-form" hidden><label class="mode-label">模式<select name="mode"><option value="ASK">Ask · 只读问答</option><option value="PLAN">Plan · 只读计划</option><option value="QUICK">Quick · 无工具</option></select></label><textarea name="text" maxlength="8000" required placeholder="向自己的电脑发送消息" aria-label="消息内容"></textarea><button>发送</button><small>移动端不能批准文件写入或命令。电脑需保持运行。</small></form></body></html>
